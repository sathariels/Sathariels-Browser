name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, such as v0.1.0. Required when this run is not a tag push.
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode.app ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcode-select -p
          xcodebuild -version

      - name: Prepare Sparkle signing key
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          SPARKLE_WORK_DIR: ${{ runner.temp }}/sparkle-work
        run: |
          echo "::add-mask::${SPARKLE_PRIVATE_KEY}"
          bash ./scripts/sparkle-prepare.sh

      - name: Build, ad-hoc sign, and package
        run: ./scripts/build-app.sh

      - name: Check packaged artifacts
        run: |
          ls -lh dist
          test -d "dist/Sathariels Browser.app"
          test -f "dist/Sathariels Browser-macos.zip"
          test -f "dist/Sathariels Browser.dmg"

      - name: Sample idle RAM
        continue-on-error: true
        timeout-minutes: 3
        run: |
          set +e
          APP="$PWD/dist/Sathariels Browser.app"
          cleanup() { killall "Sathariels Browser" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          echo "Launching a fresh window on the new tab page."
          open -n "$APP"
          for _ in $(seq 1 40); do
            pgrep -x "Sathariels Browser" >/dev/null && break
            sleep 0.25
          done
          sleep 3
          ROOT="$(pgrep -x "Sathariels Browser" | head -n 1)"
          echo "IDLE_RAM_ROOT=${ROOT:-missing}"
          if [ -z "$ROOT" ]; then
            ps -axo pid,ppid,rss,comm | grep -i -E "Sathariel|WebKit" || true
            exit 0
          fi
          SEEN=" $ROOT "
          QUEUE="$ROOT"
          SUM=0
          while [ -n "$QUEUE" ]; do
            NEXT=""
            for PID in $QUEUE; do
              RSS="$(ps -o rss= -p "$PID" 2>/dev/null | tr -d ' ')"
              COMM="$(ps -o comm= -p "$PID" 2>/dev/null)"
              if [ -n "$RSS" ]; then
                echo "pid=$PID rss_kb=$RSS comm=$COMM"
                SUM=$((SUM + RSS))
              fi
              KIDS="$(pgrep -P "$PID" || true)"
              for KID in $KIDS; do
                case "$SEEN" in
                  *" $KID "*) ;;
                  *) SEEN="$SEEN$KID "; NEXT="$NEXT $KID" ;;
                esac
              done
            done
            QUEUE="$NEXT"
          done
          echo "IDLE_RAM_TOTAL_KB=$SUM"
          echo "IDLE_RAM_TOTAL_MB=$((SUM / 1024))"
          echo "Other WebKit processes on the runner:"
          ps -axo pid,ppid,rss,comm | grep -i WebKit || true
          exit 0

      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            printf 'name=%s\n' "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_TAG" ]; then
            printf 'name=%s\n' "$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "workflow_dispatch needs a tag input such as v0.1.0" >&2
            exit 1
          fi

      - name: Sign the update and write the appcast
        if: env.SPARKLE_SIGNING == '1'
        env:
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          VERSION="${RELEASE_TAG#v}"
          bash ./scripts/sparkle-appcast.sh \
            "$PWD/dist/Sathariels Browser-macos.zip" \
            "$VERSION" \
            "$RELEASE_TAG" \
            "$SPARKLE_KEY_FILE" \
            "$SPARKLE_BIN" \
            "$PWD/dist/appcast.xml"
          test -s "$PWD/dist/appcast.xml"

      - name: Stage release files
        run: |
          mkdir -p dist/publish
          cp "dist/Sathariels Browser-macos.zip" dist/publish/
          cp "dist/Sathariels Browser.dmg" dist/publish/
          if [ -f dist/appcast.xml ]; then cp dist/appcast.xml dist/publish/; fi
          ls -lh dist/publish

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Sathariels Browser ${{ steps.tag.outputs.name }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: dist/publish/*
          body: |
            Ad-hoc signed macOS build of Sathariels Browser.

            Download `Sathariels Browser-macos.zip` or `Sathariels Browser.dmg`, then drag `Sathariels Browser.app` to `/Applications`. Later versions are offered from the application menu, Check for Updates….

            The signature is ad-hoc, so Gatekeeper does not treat it as a Developer ID app. The first time you open it, right-click the app, choose Open, then Open again. If macOS only offers Move to Trash, use System Settings → Privacy & Security → Open Anyway.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
