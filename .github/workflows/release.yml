name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish, such as v0.1.0. Required when this run is not a tag push.
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode.app ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcode-select -p
          xcodebuild -version

      - name: Build, ad-hoc sign, and package
        run: ./scripts/build-app.sh

      - name: Check packaged artifacts
        run: |
          ls -lh dist
          test -d "dist/Sathariels Browser.app"
          test -f "dist/Sathariels Browser-macos.zip"
          test -f "dist/Sathariels Browser.dmg"

      - name: Resolve release tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            printf 'name=%s\n' "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
          elif [ -n "$INPUT_TAG" ]; then
            printf 'name=%s\n' "$INPUT_TAG" >> "$GITHUB_OUTPUT"
          else
            echo "workflow_dispatch needs a tag input such as v0.1.0" >&2
            exit 1
          fi

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: Sathariels Browser ${{ steps.tag.outputs.name }}
          fail_on_unmatched_files: true
          generate_release_notes: true
          files: |
            dist/Sathariels Browser-macos.zip
            dist/Sathariels Browser.dmg
          body: |
            Ad-hoc signed macOS build of Sathariels Browser.

            Download `Sathariels Browser-macos.zip` or `Sathariels Browser.dmg`, then drag `Sathariels Browser.app` to `/Applications`.

            The signature is ad-hoc, so Gatekeeper does not treat it as a Developer ID app. The first time you open it, right-click the app, choose Open, then Open again. If macOS only offers Move to Trash, use System Settings → Privacy & Security → Open Anyway.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
