name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: Compile Release
    runs-on: macos-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          if [ -d /Applications/Xcode.app ]; then
            sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Test popup windows
        run: |
          xcodebuild test \
            -project SatharielsBrowser.xcodeproj \
            -scheme SatharielsBrowser \
            -destination "platform=macOS" \
            -derivedDataPath build/DerivedData \
            -only-testing:SatharielsBrowserTests/SatharielsBrowserTests/testAdoptedWindowReusesScriptHandlers \
            -only-testing:SatharielsBrowserTests/SatharielsBrowserTests/testWindowOpenAndTargetBlankDoNotCrash \
            CODE_SIGN_STYLE=Manual \
            "CODE_SIGN_IDENTITY=-" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            ENABLE_HARDENED_RUNTIME=NO \
            DEVELOPMENT_TEAM=""

      - name: Compile Release
        run: |
          xcodebuild \
            -project SatharielsBrowser.xcodeproj \
            -scheme SatharielsBrowser \
            -configuration Release \
            -destination "platform=macOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_STYLE=Manual \
            "CODE_SIGN_IDENTITY=-" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            ENABLE_HARDENED_RUNTIME=NO \
            DEVELOPMENT_TEAM="" \
            build

      - name: Screenshot the new tab page and address bar
        run: bash scripts/capture-ui.sh

      - name: Upload UI screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: dist/screenshots/*
          if-no-files-found: error
